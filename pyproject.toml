# pyproject.toml
[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "oldest-supported-numpy"
]
build-backend = "setuptools.build_meta"

[project]
name = "pytdigest"
version = "0.1.5"
description = "Python package for *fast* T-Digest calculation."
readme = "README.rst"
requires-python = ">=3.7"
license = {text = "Apache Software License"}
authors = [
    {name = "Tomas Protivinsky", email = "tomas.protivinsky@gmail.com"},
]
keywords = ["tdigest", "t-digest", "distribution", "statistics", "quantile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/protivinsky/pytdigest"
Documentation = "https://protivinsky.github.io/pytdigest"
Repository = "https://github.com/protivinsky/pytdigest"
Issues = "https://github.com/protivinsky/pytdigest/issues"

[tool.setuptools]
packages = ["pytdigest"]
include-package-data = true

#[tool.setuptools.package-data]
#pytdigest = [
#    "*.c",
#    "*.h",
#]

[[tool.setuptools.ext-modules]]
name = "pytdigest._tdigest"
sources = ["pytdigest/tdigest_module.c"]

